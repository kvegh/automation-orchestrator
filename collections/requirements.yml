---
# Collections required by deploy-automation-orchestrator.yml.
#
# Not read by AAP project sync: AAP resolves requirements at the project root
# (<project>/collections/requirements.yml), and this repo's project root is
# AAP-advanced-features/, not this directory. Nothing installs from this file
# today -- the collections come baked into the ee-supported-rhel9 image.
#
# This file is the input for the planned switch to a minimal custom EE. It is
# wired up (commented out) as dependencies.galaxy in
# ../execution-environment/execution-environment.yml, and it is what
# ../sync-collections.yml would push to private automation hub. Keep the list
# accurate so that switch is a one-line uncomment.
collections:
  - name: redhat.openshift    # k8s -- all OCP resource mutations
  - name: kubernetes.core     # k8s_info -- all OCP queries, and the
                              # group/kubernetes.core.k8s module_defaults group
